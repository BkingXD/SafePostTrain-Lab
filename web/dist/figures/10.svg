<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" role="img" aria-labelledby="title desc"><title id="title">反馈来源与优化方法是不同维度</title><desc id="desc">从反馈来源到训练信号、优化方法和独立评测的关系。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#7c947c"/></marker></defs><rect width="1000" height="250" rx="20" fill="#f8faf5" stroke="#dce6d7"/><g font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, sans-serif"><text x="36" y="43" fill="#193d30" font-size="24" font-weight="700">反馈来源与优化方法是不同维度</text><rect x="28" y="78" width="160" height="82" rx="13" fill="#eef4e8" stroke="#ceddc6"/><text x="43" y="112" fill="#234735" font-size="19" font-weight="700">反馈来源</text><text x="43" y="138" fill="#526b58" font-size="14" >人类 / 模型 / 规则</text><path d="M 193 119 L 217 119" fill="none" stroke="#7c947c" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="224" y="78" width="160" height="82" rx="13" fill="#eef4e8" stroke="#ceddc6"/><text x="239" y="112" fill="#234735" font-size="19" font-weight="700">评分与检查</text><text x="239" y="138" fill="#526b58" font-size="14" >结果 / 过程 / 环境</text><path d="M 389 119 L 413 119" fill="none" stroke="#7c947c" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="420" y="78" width="160" height="82" rx="13" fill="#eef4e8" stroke="#ceddc6"/><text x="435" y="112" fill="#234735" font-size="19" font-weight="700">构造信号</text><text x="435" y="138" fill="#526b58" font-size="14" >奖励 / 代价 / 偏好</text><path d="M 585 119 L 609 119" fill="none" stroke="#7c947c" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="616" y="78" width="160" height="82" rx="13" fill="#eef4e8" stroke="#ceddc6"/><text x="631" y="112" fill="#234735" font-size="19" font-weight="700">优化方法</text><text x="631" y="138" fill="#526b58" font-size="14" >DPO / PPO / GRPO</text><path d="M 781 119 L 805 119" fill="none" stroke="#7c947c" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="812" y="78" width="160" height="82" rx="13" fill="#eef4e8" stroke="#ceddc6"/><text x="827" y="112" fill="#234735" font-size="19" font-weight="700">独立评价</text><text x="827" y="138" fill="#526b58" font-size="14" >裁判复核与反例</text><text x="36" y="210" fill="#526b58" font-size="17" >RLHF、RLAIF、RLVR 描述反馈；算法选择是另一维度。</text></g></svg>
