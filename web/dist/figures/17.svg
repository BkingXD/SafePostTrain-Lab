<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" role="img" aria-labelledby="title desc"><title id="title">从实验到可复现交付</title><desc id="desc">从实验卡、训练与评测记录到部署和模型卡的证据链。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#7c947c"/></marker></defs><rect width="1000" height="250" rx="20" fill="#f8faf5" stroke="#dce6d7"/><g font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, sans-serif"><text x="36" y="43" fill="#193d30" font-size="24" font-weight="700">从实验到可复现交付</text><rect x="28" y="78" width="160" height="82" rx="13" fill="#eef4e8" stroke="#ceddc6"/><text x="43" y="112" fill="#234735" font-size="19" font-weight="700">实验卡</text><text x="43" y="138" fill="#526b58" font-size="14" >问题 / 对照 / 预算</text><path d="M 193 119 L 217 119" fill="none" stroke="#7c947c" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="224" y="78" width="160" height="82" rx="13" fill="#eef4e8" stroke="#ceddc6"/><text x="239" y="112" fill="#234735" font-size="19" font-weight="700">训练制品</text><text x="239" y="138" fill="#526b58" font-size="14" >模型 / 数据 / 配置</text><path d="M 389 119 L 413 119" fill="none" stroke="#7c947c" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="420" y="78" width="160" height="82" rx="13" fill="#eef4e8" stroke="#ceddc6"/><text x="435" y="112" fill="#234735" font-size="19" font-weight="700">原始输出</text><text x="435" y="138" fill="#526b58" font-size="14" >样本 / 裁判 / 日志</text><path d="M 585 119 L 609 119" fill="none" stroke="#7c947c" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="616" y="78" width="160" height="82" rx="13" fill="#eef4e8" stroke="#ceddc6"/><text x="631" y="112" fill="#234735" font-size="19" font-weight="700">复算与复核</text><text x="631" y="138" fill="#526b58" font-size="14" >指标 / 消融 / 局限</text><path d="M 781 119 L 805 119" fill="none" stroke="#7c947c" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="812" y="78" width="160" height="82" rx="13" fill="#eef4e8" stroke="#ceddc6"/><text x="827" y="112" fill="#234735" font-size="19" font-weight="700">部署与模型卡</text><text x="827" y="138" fill="#526b58" font-size="14" >量化回归 / 版本</text><text x="36" y="210" fill="#526b58" font-size="17" >结果需能回溯模型、代码、数据和协议；负结果也应保存。</text></g></svg>
