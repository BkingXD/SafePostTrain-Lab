<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 270" role="img" aria-labelledby="title desc"><title id="title">DPO：四个 log-prob 进入同一个偏好损失</title><desc id="desc">当前策略与冻结参考对 chosen/rejected 的四项概率，共同决定 DPO 相对目标。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#7c947c"/></marker></defs><rect width="1000" height="270" rx="20" fill="#f8faf5" stroke="#dce6d7"/><g font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, sans-serif"><text x="36" y="43" fill="#193d30" font-size="24" font-weight="700">DPO：四个 log-prob 进入同一个偏好损失</text><rect x="35" y="75" width="270" height="53" rx="13" fill="#e7f2e5" stroke="#ceddc6"/><text x="170" y="108" fill="#234735" font-size="18" text-anchor="middle">当前 log πθ(chosen)</text><rect x="35" y="145" width="270" height="53" rx="13" fill="#f0f0ec" stroke="#ceddc6"/><text x="170" y="178" fill="#526b58" font-size="18" text-anchor="middle">参考 log πref(chosen)</text><rect x="365" y="75" width="270" height="53" rx="13" fill="#e7f2e5" stroke="#ceddc6"/><text x="500" y="108" fill="#234735" font-size="18" text-anchor="middle">当前 log πθ(rejected)</text><rect x="365" y="145" width="270" height="53" rx="13" fill="#f0f0ec" stroke="#ceddc6"/><text x="500" y="178" fill="#526b58" font-size="18" text-anchor="middle">参考 log πref(rejected)</text><text x="170" y="141" fill="#526b58" font-size="20" text-anchor="middle">−</text><text x="500" y="141" fill="#526b58" font-size="20" text-anchor="middle">−</text><path d="M 650 136 L 705 136" fill="none" stroke="#7c947c" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="720" y="94" width="242" height="85" rx="13" fill="#e5efe0" stroke="#ceddc6"/><text x="841" y="126" fill="#234735" font-size="15" text-anchor="middle" font-weight="700">Δ = 选中增量 − 拒绝增量</text><text x="841" y="155" fill="#234735" font-size="19" text-anchor="middle">L = −log σ(βΔ)</text><text x="37" y="235" fill="#526b58" font-size="17" >两侧的策略增量分别为：当前 log-prob 减参考 log-prob。</text></g></svg>
