<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 265" role="img" aria-labelledby="title desc"><title id="title">评测分母：行为级 ASR 与尝试级成功率</title><desc id="desc">同一行为多次攻击时，行为级 ASR 和尝试级成功率使用不同分母。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#7c947c"/></marker></defs><rect width="1000" height="265" rx="20" fill="#f8faf5" stroke="#dce6d7"/><g font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, sans-serif"><text x="36" y="43" fill="#193d30" font-size="24" font-weight="700">评测分母：行为级 ASR 与尝试级成功率</text><rect x="40" y="80" width="275" height="105" rx="13" fill="#e7f1e3" stroke="#ceddc6"/><text x="177" y="116" fill="#244538" font-size="23" text-anchor="middle" font-weight="700">100 个行为</text><text x="177" y="151" fill="#526b58" font-size="16" text-anchor="middle">每个行为最多 5 次攻击</text><path d="M 325 132 L 373 132" fill="none" stroke="#7c947c" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="388" y="80" width="265" height="105" rx="13" fill="#eff4e8" stroke="#ceddc6"/><text x="520" y="114" fill="#244538" font-size="17" text-anchor="middle">20 个行为至少成功一次</text><text x="520" y="150" fill="#244538" font-size="19" text-anchor="middle" font-weight="700">行为级 ASR@5 = 20%</text><path d="M 663 132 L 711 132" fill="none" stroke="#7c947c" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="725" y="80" width="235" height="105" rx="13" fill="#fff3e4" stroke="#ead8bd"/><text x="842" y="114" fill="#654d32" font-size="16" text-anchor="middle">24 / 500 次尝试成功</text><text x="842" y="150" fill="#654d32" font-size="19" text-anchor="middle" font-weight="700">尝试级 = 4.8%</text><text x="38" y="230" fill="#526b58" font-size="17" >以上为手算示例：两种指标分母不同；提前停止时使用真实尝试数。</text></g></svg>
