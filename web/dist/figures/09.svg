<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 270" role="img" aria-labelledby="title desc"><title id="title">GRPO：同一问题的组内相对优势</title><desc id="desc">四个奖励经组均值与总体标准差归一化，形成正负优势。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#7c947c"/></marker></defs><rect width="1000" height="270" rx="20" fill="#f8faf5" stroke="#dce6d7"/><g font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, sans-serif"><text x="36" y="43" fill="#193d30" font-size="24" font-weight="700">GRPO：同一问题的组内相对优势</text><rect x="70" y="77" width="125" height="53" rx="13" fill="#e0efdc" stroke="#ceddc6"/><text x="132" y="109" fill="#244538" font-size="19" text-anchor="middle">奖励  1</text><path d="M 132 135 L 132 160" fill="none" stroke="#7c947c" stroke-width="2.2" marker-end="url(#arrow)"/><text x="132" y="192" fill="#275d3b" font-size="18" text-anchor="middle" font-weight="700">优势  +1</text><rect x="225" y="77" width="125" height="53" rx="13" fill="#e0efdc" stroke="#ceddc6"/><text x="287" y="109" fill="#244538" font-size="19" text-anchor="middle">奖励  1</text><path d="M 287 135 L 287 160" fill="none" stroke="#7c947c" stroke-width="2.2" marker-end="url(#arrow)"/><text x="287" y="192" fill="#275d3b" font-size="18" text-anchor="middle" font-weight="700">优势  +1</text><rect x="380" y="77" width="125" height="53" rx="13" fill="#f0f0eb" stroke="#ceddc6"/><text x="442" y="109" fill="#244538" font-size="19" text-anchor="middle">奖励  0</text><path d="M 442 135 L 442 160" fill="none" stroke="#7c947c" stroke-width="2.2" marker-end="url(#arrow)"/><text x="442" y="192" fill="#946a4d" font-size="18" text-anchor="middle" font-weight="700">优势  −1</text><rect x="535" y="77" width="125" height="53" rx="13" fill="#f0f0eb" stroke="#ceddc6"/><text x="597" y="109" fill="#244538" font-size="19" text-anchor="middle">奖励  0</text><path d="M 597 135 L 597 160" fill="none" stroke="#7c947c" stroke-width="2.2" marker-end="url(#arrow)"/><text x="597" y="192" fill="#946a4d" font-size="18" text-anchor="middle" font-weight="700">优势  −1</text><rect x="705" y="80" width="245" height="108" rx="13" fill="#fff4e3" stroke="#ead7b8"/><text x="827" y="112" fill="#654d32" font-size="19" text-anchor="middle">均值 = 0.5</text><text x="827" y="141" fill="#654d32" font-size="17" text-anchor="middle">总体标准差 = 0.5</text><text x="827" y="169" fill="#654d32" font-size="16" text-anchor="middle">全同分 → 相对优势为零</text><text x="38" y="235" fill="#526b58" font-size="17" >同一 prompt 的 4 个回答；示例忽略极小 ε，不同实现的归一化可能不同。</text></g></svg>
