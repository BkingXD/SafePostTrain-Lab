<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" role="img" aria-labelledby="title desc"><title id="title">训练显存与资源测量</title><desc id="desc">显存由权重、梯度、激活、临时张量和缓存共同构成。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#7c947c"/></marker></defs><rect width="1000" height="250" rx="20" fill="#f8faf5" stroke="#dce6d7"/><g font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, sans-serif"><text x="36" y="43" fill="#193d30" font-size="24" font-weight="700">训练显存与资源测量</text><rect x="28" y="78" width="160" height="82" rx="13" fill="#eef4e8" stroke="#ceddc6"/><text x="43" y="112" fill="#234735" font-size="19" font-weight="700">模型权重</text><text x="43" y="138" fill="#526b58" font-size="14" >底模 / adapter</text><path d="M 193 119 L 217 119" fill="none" stroke="#7c947c" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="224" y="78" width="160" height="82" rx="13" fill="#eef4e8" stroke="#ceddc6"/><text x="239" y="112" fill="#234735" font-size="19" font-weight="700">梯度与优化器</text><text x="239" y="138" fill="#526b58" font-size="14" >只作用于可训练项</text><path d="M 389 119 L 413 119" fill="none" stroke="#7c947c" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="420" y="78" width="160" height="82" rx="13" fill="#eef4e8" stroke="#ceddc6"/><text x="435" y="112" fill="#234735" font-size="19" font-weight="700">激活与缓存</text><text x="435" y="138" fill="#526b58" font-size="14" >随长度和 batch 变化</text><path d="M 585 119 L 609 119" fill="none" stroke="#7c947c" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="616" y="78" width="160" height="82" rx="13" fill="#eef4e8" stroke="#ceddc6"/><text x="631" y="112" fill="#234735" font-size="19" font-weight="700">临时与通信</text><text x="631" y="138" fill="#526b58" font-size="14" >算子 / 分片 / rollout</text><path d="M 781 119 L 805 119" fill="none" stroke="#7c947c" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="812" y="78" width="160" height="82" rx="13" fill="#eef4e8" stroke="#ceddc6"/><text x="827" y="112" fill="#234735" font-size="19" font-weight="700">实际测量</text><text x="827" y="138" fill="#526b58" font-size="14" >已分配 / 保留 / 总量</text><text x="36" y="210" fill="#526b58" font-size="17" >PyTorch 分配器峰值与设备总占用口径不同；参数量不等于总显存。</text></g></svg>
