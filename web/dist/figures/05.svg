<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" role="img" aria-labelledby="title desc"><title id="title">LoRA：冻结原矩阵，只训练低秩增量</title><desc id="desc">矩阵形状、低秩增量和新增参数的计算。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#7c947c"/></marker></defs><rect width="1000" height="250" rx="20" fill="#f8faf5" stroke="#dce6d7"/><g font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, sans-serif"><text x="36" y="43" fill="#193d30" font-size="24" font-weight="700">LoRA：冻结原矩阵，只训练低秩增量</text><rect x="40" y="85" width="190" height="90" rx="13" fill="#e6ede6" stroke="#ceddc6"/><text x="135" y="119" fill="#234735" font-size="21" text-anchor="middle" font-weight="700">冻结底模 W₀</text><text x="135" y="149" fill="#526b58" font-size="17" text-anchor="middle">d_out × d_in</text><text x="256" y="143" fill="#526b58" font-size="32" >+</text><rect x="310" y="85" width="145" height="90" rx="13" fill="#dcebd7" stroke="#ceddc6"/><text x="382" y="123" fill="#234735" font-size="26" text-anchor="middle" font-weight="700">B</text><text x="382" y="150" fill="#526b58" font-size="16" text-anchor="middle">d_out × r</text><text x="470" y="143" fill="#526b58" font-size="30" >×</text><rect x="520" y="105" width="180" height="50" rx="13" fill="#dcebd7" stroke="#ceddc6"/><text x="610" y="137" fill="#234735" font-size="18" text-anchor="middle" font-weight="700">A : r × d_in</text><path d="M 714 130 L 765 130" fill="none" stroke="#7c947c" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="775" y="90" width="190" height="80" rx="13" fill="#e9f0e0" stroke="#ceddc6"/><text x="870" y="123" fill="#234735" font-size="17" text-anchor="middle" font-weight="700">W = W₀ + (α/r)BA</text><text x="870" y="149" fill="#526b58" font-size="16" text-anchor="middle">只更新 A 和 B</text><text x="38" y="219" fill="#526b58" font-size="17" >新增参数：r × (d_in + d_out)；显存还包括激活、底模和优化器。</text></g></svg>
