<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" role="img" aria-labelledby="title desc"><title id="title">从数据到助手：训练阶段与产物</title><desc id="desc">数据、底模、后训练和评测之间的关系；阶段顺序需按具体模型确认。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#7c947c"/></marker></defs><rect width="1000" height="250" rx="20" fill="#f8faf5" stroke="#dce6d7"/><g font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, sans-serif"><text x="36" y="43" fill="#193d30" font-size="24" font-weight="700">从数据到助手：训练阶段与产物</text><rect x="28" y="78" width="160" height="82" rx="13" fill="#eef4e8" stroke="#ceddc6"/><text x="43" y="112" fill="#234735" font-size="19" font-weight="700">原始语料</text><text x="43" y="138" fill="#526b58" font-size="14" >预测下一个 token</text><path d="M 193 119 L 217 119" fill="none" stroke="#7c947c" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="224" y="78" width="160" height="82" rx="13" fill="#eef4e8" stroke="#ceddc6"/><text x="239" y="112" fill="#234735" font-size="19" font-weight="700">预训练</text><text x="239" y="138" fill="#526b58" font-size="14" >得到通用底模</text><path d="M 389 119 L 413 119" fill="none" stroke="#7c947c" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="420" y="78" width="160" height="82" rx="13" fill="#eef4e8" stroke="#ceddc6"/><text x="435" y="112" fill="#234735" font-size="19" font-weight="700">继续预训练</text><text x="435" y="138" fill="#526b58" font-size="14" >适应领域分布</text><path d="M 585 119 L 609 119" fill="none" stroke="#7c947c" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="616" y="78" width="160" height="82" rx="13" fill="#eef4e8" stroke="#ceddc6"/><text x="631" y="112" fill="#234735" font-size="19" font-weight="700">SFT / 对齐</text><text x="631" y="138" fill="#526b58" font-size="14" >学习任务与偏好</text><path d="M 781 119 L 805 119" fill="none" stroke="#7c947c" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="812" y="78" width="160" height="82" rx="13" fill="#eef4e8" stroke="#ceddc6"/><text x="827" y="112" fill="#234735" font-size="19" font-weight="700">评测与部署</text><text x="827" y="138" fill="#526b58" font-size="14" >检验行为和成本</text><text x="36" y="210" fill="#526b58" font-size="17" >流程是常见路径；具体项目可跳过或交替阶段。</text></g></svg>
