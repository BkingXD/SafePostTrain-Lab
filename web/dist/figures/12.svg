<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 285" role="img" aria-labelledby="title desc"><title id="title">安全对齐：按意图选择边界</title><desc id="desc">合法、有害及混合请求需要不同处理，并共同评估帮助性与安全性。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#7c947c"/></marker></defs><rect width="1000" height="285" rx="20" fill="#f8faf5" stroke="#dce6d7"/><g font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, sans-serif"><text x="36" y="43" fill="#193d30" font-size="24" font-weight="700">安全对齐：按意图选择边界</text><rect x="35" y="78" width="285" height="62" rx="13" fill="#e6f1e2" stroke="#ceddc6"/><text x="177" y="115" fill="#244538" font-size="20" text-anchor="middle" font-weight="700">合法敏感请求</text><path d="M 326 109 L 382 109" fill="none" stroke="#7c947c" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="395" y="78" width="250" height="62" rx="13" fill="#f2f7ed" stroke="#ceddc6"/><text x="520" y="115" fill="#244538" font-size="18" text-anchor="middle">提供合适的帮助</text><rect x="35" y="151" width="285" height="62" rx="13" fill="#fff1e8" stroke="#edd4c4"/><text x="177" y="188" fill="#74503f" font-size="20" text-anchor="middle" font-weight="700">明确有害请求</text><path d="M 326 182 L 382 182" fill="none" stroke="#7c947c" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="395" y="151" width="250" height="62" rx="13" fill="#fff7ee" stroke="#eddcc8"/><text x="520" y="188" fill="#74503f" font-size="18" text-anchor="middle">限制有害帮助</text><rect x="700" y="94" width="260" height="106" rx="13" fill="#eaf0e4" stroke="#ceddc6"/><text x="830" y="127" fill="#244538" font-size="20" text-anchor="middle" font-weight="700">独立评测</text><text x="830" y="153" fill="#526b58" font-size="16" text-anchor="middle">有害完成 / 误拒绝</text><text x="830" y="178" fill="#526b58" font-size="16" text-anchor="middle">普通能力 / 成本</text><text x="38" y="253" fill="#526b58" font-size="17" >混合请求需区分允许与限制部分；按内容和意图判断，不只看关键词。</text></g></svg>
