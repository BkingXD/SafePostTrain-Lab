<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" role="img" aria-labelledby="title desc"><title id="title">偏好标注如何训练奖励模型</title><desc id="desc">同一问题的两个回答经评分模型与成对排序损失形成训练信号。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#7c947c"/></marker></defs><rect width="1000" height="250" rx="20" fill="#f8faf5" stroke="#dce6d7"/><g font-family="Noto Sans CJK SC, Noto Sans SC, Microsoft YaHei, sans-serif"><text x="36" y="43" fill="#193d30" font-size="24" font-weight="700">偏好标注如何训练奖励模型</text><rect x="28" y="78" width="160" height="82" rx="13" fill="#eef4e8" stroke="#ceddc6"/><text x="43" y="112" fill="#234735" font-size="19" font-weight="700">同一问题 x</text><text x="43" y="138" fill="#526b58" font-size="14" >固定 prompt</text><path d="M 193 119 L 217 119" fill="none" stroke="#7c947c" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="224" y="78" width="160" height="82" rx="13" fill="#eef4e8" stroke="#ceddc6"/><text x="239" y="112" fill="#234735" font-size="19" font-weight="700">两个回答</text><text x="239" y="138" fill="#526b58" font-size="14" >chosen / rejected</text><path d="M 389 119 L 413 119" fill="none" stroke="#7c947c" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="420" y="78" width="160" height="82" rx="13" fill="#eef4e8" stroke="#ceddc6"/><text x="435" y="112" fill="#234735" font-size="19" font-weight="700">评分模型</text><text x="435" y="138" fill="#526b58" font-size="14" >r(x,y+) / r(x,y−)</text><path d="M 585 119 L 609 119" fill="none" stroke="#7c947c" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="616" y="78" width="160" height="82" rx="13" fill="#eef4e8" stroke="#ceddc6"/><text x="631" y="112" fill="#234735" font-size="19" font-weight="700">分数差</text><text x="631" y="138" fill="#526b58" font-size="14" >σ(r+ − r−)</text><path d="M 781 119 L 805 119" fill="none" stroke="#7c947c" stroke-width="2.2" marker-end="url(#arrow)"/><rect x="812" y="78" width="160" height="82" rx="13" fill="#eef4e8" stroke="#ceddc6"/><text x="827" y="112" fill="#234735" font-size="19" font-weight="700">排序损失</text><text x="827" y="138" fill="#526b58" font-size="14" >−log P(chosen)</text><text x="36" y="210" fill="#526b58" font-size="17" >得分排序不是安全真值；还要检查校准、长度偏差和分布外样本。</text></g></svg>
